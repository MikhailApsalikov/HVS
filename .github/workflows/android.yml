name: Android preview
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'apps/mobile/**'
      - 'packages/**'
      - 'scripts/**'
      - '*package*'
      - 'pnpm-*.yaml'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Generate a local preview signing key
        run: keytool -genkeypair -keystore apps/mobile/android/app/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
      - name: Build offline preview APK
        working-directory: apps/mobile/android
        run: bash gradlew :app:assemblePreview --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: hunters-versus-spiders-android-preview
          path: apps/mobile/android/app/build/outputs/apk/preview/*.apk
          if-no-files-found: error
